<!-- Decorative, so hidden from assistive tech. Hidden entirely (display:none) unless <html> has
     .is-preloading. Each letter has its own span so it can rise out of the word's mask. -->
<div class="preloader" data-preloader-el aria-hidden="true">
  <div class="preloader__word"><span class="preloader__char">S</span><span class="preloader__char">H</span><span class="preloader__char">O</span><span class="preloader__char">I</span><span class="preloader__char">B</span></div>
</div>
